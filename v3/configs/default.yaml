# ============================================================
# Default config for track annotation pipeline
# Override via CLI: --config configs/person_tracking.yaml
# Or via env var: TRACK_ANN__DETECTION__CONF=0.3
# ============================================================
#
# Brand pool is NOT defined here. It lives in the brand registry
# at data/logo_templates/brands.yaml — referenced by `logo_templates.registry_file`.
# Variant selection is governed by the per-match kit_context (passed via
# CLI --kit-context or sidecar match.meta.yaml).
# ============================================================

device: "auto"

video:
  processing_fps: 5
  max_duration_s: null

detection:
  weights: "weights/yolo11l.pt"
  target_classes: [0]
  conf: 0.25
  iou: 0.45
  imgsz: 1280
  half: true
  max_det: 100

tracking:
  tracker: "botsort.yaml"
  min_track_duration_frames: 5
  min_track_area_ratio: 0.0005
  persist: true

keyframe:
  num_per_track: 3
  strategies:
    - "sharpest"
    - "largest"
    - "midpoint"
  pad_ratio: 0.15
  min_crop_size: 96

clip:
  duration_s: 2.0
  fps: 30
  codec: "mp4v"
  use_ffmpeg: false

package:
  include_full_frames: true
  include_crops: true
  include_clips: true
  manifest_format: "json"

logo_templates:
  dir: "data/logo_templates"
  registry_file: "brands.yaml"

logging:
  level: "INFO"
  log_to_file: true
  log_dir: "logs"
