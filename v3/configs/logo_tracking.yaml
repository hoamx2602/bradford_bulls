# ============================================================
# v1 — Logo tracking
# Use AFTER training the custom Stage A class-agnostic logo detector.
# Detects logo regions directly and tracks them; annotator only confirms brand.
# ============================================================
#
# Brand pool is loaded from data/logo_templates/brands.yaml.
# kit_context determines which variants are active for matching.
# ============================================================

device: "auto"

video:
  processing_fps: 10
  max_duration_s: null

detection:
  weights: "weights/stage_a_logo_detector.pt"
  target_classes: [0]                # single "logo" class in Stage A
  conf: 0.20
  iou: 0.50
  imgsz: 1920
  half: true
  max_det: 200

tracking:
  tracker: "botsort.yaml"
  min_track_duration_frames: 5
  min_track_area_ratio: 0.0003
  persist: true

keyframe:
  num_per_track: 3
  strategies: ["sharpest", "largest", "midpoint"]
  pad_ratio: 0.20
  min_crop_size: 128

clip:
  duration_s: 2.0
  fps: 30
  codec: "mp4v"
  use_ffmpeg: false

package:
  include_full_frames: true
  include_crops: true
  include_clips: true
  manifest_format: "json"

logo_templates:
  dir: "data/logo_templates"
  registry_file: "brands.yaml"

logging:
  level: "INFO"
  log_to_file: true
  log_dir: "logs"
